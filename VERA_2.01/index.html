<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Nancy ❤️</title>
  <link rel="stylesheet" href="styles.css">
  
  <!-- Dependencias CDN para WebGL y Animaciones -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

  <!-- Capa 1: Planeta Saturno Rojo Brillante con inclinación panorámica -->
  <div id="saturn-layer">
    <particle-saturn 
      core-color="#FF0055" 
      ring-color="#FF6699" 
      density="20" 
      particle-size="16" 
      glow="30" 
      tilt="26" 
      roll="7"
      spin-speed="6"
      drag-sensitivity="2"
      size-percent="130">
    </particle-saturn>
  </div>

  <!-- Capa 2: Contenedor de Texto Ordenado y Corrido -->
  <div class="text-wrapper text-top-pos">
    <div id="text-top" class="text-line"></div>
  </div>

  <div class="text-wrapper text-bottom-pos">
    <div id="text-bottom" class="text-line"></div>
  </div>

  <!-- Capa 3: Carrusel 3D Ubicado al Costado Derecho -->
  <div id="carousel-layer">
    <div id="round-carousel-container"></div>
  </div>

  <!-- Capa 4: Lluvia Flotante de Corazones en Espiral -->
  <div id="hearts-container"></div>

  <script src="script.js"></script>
</body>
</html>
